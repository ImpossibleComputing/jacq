[package]
name = "jac-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "jacq"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jac-syntax = { workspace = true }
jac-ir = { workspace = true }
jac-codegen-cuda = { workspace = true }

[dev-dependencies]
serde_json = "1"
